<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Trophies & Badges</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'system';
      if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
      else if(t==='system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme','dark');
    })();
  </script>
</head>
<body>

<!-- NAVBAR -->
<nav class="nav">
  <a href="index.html" class="logo">Trophies & Badges</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>
  <button class="hamburger" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
</nav>

<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobile-menu">
  <a href="index.html">Home</a>
  <a href="products.html">Products</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
</div>

<!-- AUTH PAGE -->
<div class="auth-page">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <img src="images/TandB.png" alt="Trophies & Badges">
      <h1>Trophies & Badges</h1>
      <p id="auth-subtitle">Sign in to leave reviews</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
      <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
    </div>

    <!-- SIGN IN FORM -->
    <div id="form-signin">
      <div class="form-gap">
        <div class="field">
          <label>Email</label>
          <input type="email" id="si-email" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="si-password" placeholder="Your password" autocomplete="current-password">
        </div>
        <div class="auth-error" id="si-error"></div>
        <button class="btn-primary btn-full" id="si-btn" onclick="doSignIn()">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
        <p class="auth-link">
          <a href="#" onclick="switchTab('reset'); return false;">Forgot your password?</a>
        </p>
      </div>
    </div>

    <!-- SIGN UP FORM -->
    <div id="form-signup" style="display:none;">
      <div class="form-gap">
        <div class="field">
          <label>Your Name</label>
          <input type="text" id="su-name" placeholder="Full name" autocomplete="name">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="su-email" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="su-password" placeholder="Min 6 characters" autocomplete="new-password">
        </div>
        <div class="auth-error" id="su-error"></div>
        <button class="btn-primary btn-full" id="su-btn" onclick="doSignUp()">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </div>
    </div>

    <!-- RESET PASSWORD FORM -->
    <div id="form-reset" style="display:none;">
      <div class="form-gap">
        <p style="font-size:14px;color:var(--muted);margin-bottom:4px;">Enter your email and we'll send you a reset link.</p>
        <div class="field">
          <label>Email</label>
          <input type="email" id="rs-email" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="auth-error" id="rs-error"></div>
        <button class="btn-primary btn-full" id="rs-btn" onclick="doReset()">
          <i class="fa-solid fa-envelope"></i> Send Reset Link
        </button>
        <p class="auth-link">
          <a href="#" onclick="switchTab('signin'); return false;">Back to Sign In</a>
        </p>
      </div>
    </div>

  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toast-msg"></span></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script>

  // ── Where to redirect after login ────────────────────────
  // If we came from a product page, go back to it; else go to products
  const returnUrl = new URLSearchParams(location.search).get('return') || 'products.html';

  // If already logged in, redirect immediately
  auth.onAuthStateChanged(user => {
    if (user && user.emailVerified) {
      window.location.href = returnUrl;
    }
  });

  // ── Tab switching ─────────────────────────────────────────
  function switchTab(tab) {
    ['signin','signup','reset'].forEach(t => {
      document.getElementById(`form-${t}`).style.display = 'none';
      document.getElementById(`tab-${t}`)?.classList.remove('active');
    });
    document.getElementById(`form-${tab}`).style.display = 'block';
    if (document.getElementById(`tab-${tab}`)) {
      document.getElementById(`tab-${tab}`).classList.add('active');
    }
    const subtitles = {
      signin: 'Sign in to leave reviews',
      signup: 'Create a free account',
      reset:  'Reset your password'
    };
    document.getElementById('auth-subtitle').textContent = subtitles[tab];
  }

  // ── Sign In ────────────────────────────────────────────────
  async function doSignIn() {
    const email    = document.getElementById('si-email').value.trim();
    const password = document.getElementById('si-password').value;
    const errEl    = document.getElementById('si-error');
    const btn      = document.getElementById('si-btn');

    errEl.style.display = 'none';
    if (!email || !password) {
      showError(errEl, 'Please fill in all fields.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

    try {
      await auth.signInWithEmailAndPassword(email, password);
      // onAuthStateChanged will redirect
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
      showError(errEl, friendlyError(err.code));
    }
  }

  // ── Sign Up ────────────────────────────────────────────────
  async function doSignUp() {
    const name     = document.getElementById('su-name').value.trim();
    const email    = document.getElementById('su-email').value.trim();
    const password = document.getElementById('su-password').value;
    const errEl    = document.getElementById('su-error');
    const btn      = document.getElementById('su-btn');

    errEl.style.display = 'none';
    if (!name || !email || !password) {
      showError(errEl, 'Please fill in all fields.');
      return;
    }
    if (password.length < 6) {
      showError(errEl, 'Password must be at least 6 characters.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating account...';

    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);

      // Save name to Firestore users collection
      await db.collection('users').doc(cred.user.uid).set({
        name,
        email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      // Send email verification
      await cred.user.sendEmailVerification();

      // Sign out until verified
      await auth.signOut();

      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';

      // Show success message
      document.getElementById('form-signup').innerHTML = `
        <div style="text-align:center;padding:16px 0;">
          <i class="fa-solid fa-envelope-circle-check" style="font-size:48px;color:var(--primary);margin-bottom:16px;display:block;"></i>
          <h3 style="font-size:18px;font-weight:800;margin-bottom:10px;">Verify your email</h3>
          <p style="font-size:14px;color:var(--muted);line-height:1.7;">
            We sent a verification link to <strong>${escapeHtml(email)}</strong>.<br>
            Click it, then come back to sign in.
          </p>
          <button class="btn-primary btn-sm" style="margin-top:20px;" onclick="switchTab('signin')">
            Go to Sign In
          </button>
        </div>`;

    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
      showError(errEl, friendlyError(err.code));
    }
  }

  // ── Reset Password ─────────────────────────────────────────
  async function doReset() {
    const email = document.getElementById('rs-email').value.trim();
    const errEl = document.getElementById('rs-error');
    const btn   = document.getElementById('rs-btn');

    errEl.style.display = 'none';
    if (!email) { showError(errEl, 'Please enter your email.'); return; }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

    try {
      await auth.sendPasswordResetEmail(email);
      showToast('Reset link sent! Check your inbox.');
      switchTab('signin');
    } catch (err) {
      showError(errEl, friendlyError(err.code));
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-envelope"></i> Send Reset Link';
    }
  }

  // ── Helpers ────────────────────────────────────────────────
  function showError(el, msg) {
    el.textContent = msg;
    el.style.display = 'block';
  }

  function friendlyError(code) {
    const map = {
      'auth/invalid-email':            'Invalid email address.',
      'auth/user-not-found':           'No account found with that email.',
      'auth/wrong-password':           'Incorrect password.',
      'auth/invalid-credential':       'Incorrect email or password.',
      'auth/email-already-in-use':     'An account with that email already exists.',
      'auth/weak-password':            'Password must be at least 6 characters.',
      'auth/too-many-requests':        'Too many attempts. Please try again later.',
      'auth/network-request-failed':   'Network error. Check your connection.',
    };
    return map[code] || 'Something went wrong. Please try again.';
  }

  // ── Enter key support ──────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const active = document.querySelector('[id^="form-"]:not([style*="none"])');
    if (!active) return;
    if (active.id === 'form-signin') doSignIn();
    if (active.id === 'form-signup') doSignUp();
    if (active.id === 'form-reset')  doReset();
  });

</script>
</body>
</html>
