<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Trophies & Badges</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script>
  // Apply saved theme immediately to prevent flash
  (function(){
    var t = localStorage.getItem('theme') || 'system';
    if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
    else if(t==='system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.setAttribute('data-theme','dark');
  })();
</script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>Trophies & Badges</h1>
      <p>Sign in to continue shopping</p>
    </div>

    <!-- TABS -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login"  onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab"        id="tab-signup" onclick="switchTab('signup')">Create Account</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-form">
      <div class="form-gap">
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="auth-error" id="login-error"></div>
        <button class="btn btn-primary btn-full" id="login-btn">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
        <div class="auth-link">
          <a href="#" id="forgot-link">Forgot your password?</a>
        </div>
      </div>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signup-form" style="display:none;">
      <div class="form-gap">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="signup-name" placeholder="Your full name" autocomplete="name">
        </div>
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label>Phone Number</label>
          <input type="tel" id="signup-phone" placeholder="+27 00 000 0000" autocomplete="tel">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="Min. 6 characters" autocomplete="new-password">
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <input type="password" id="signup-confirm" placeholder="Repeat password">
        </div>
        <div class="auth-error" id="signup-error"></div>
        <button class="btn btn-primary btn-full" id="signup-btn">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </div>
    </div>

    <!-- FORGOT PASSWORD -->
    <div id="forgot-form" style="display:none;">
      <div class="form-gap">
        <p style="font-size:14px;color:var(--muted);">Enter your email and we'll send a reset link.</p>
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="reset-email" placeholder="you@example.com">
        </div>
        <div class="auth-error" id="reset-error"></div>
        <div class="auth-error" id="reset-success" style="background:#e6f7ec;color:#1a7a3a;border-color:#c3e6cb;"></div>
        <button class="btn btn-primary btn-full" id="reset-btn">
          <i class="fa-solid fa-envelope"></i> Send Reset Link
        </button>
        <div class="auth-link">
          <a href="#" onclick="switchTab('login')">Back to Sign In</a>
        </div>
      </div>
    </div>

    <!-- VERIFY EMAIL NOTICE -->
    <div id="verify-notice" style="display:none;margin-top:16px;">
      <div style="background:#e6f7ec;border:1px solid #c3e6cb;border-radius:10px;padding:14px;font-size:14px;color:#1a7a3a;text-align:center;">
        <i class="fa-solid fa-envelope-circle-check" style="font-size:24px;margin-bottom:8px;display:block;"></i>
        <strong>Check your email!</strong><br>
        We sent a verification link. Please verify before continuing.
      </div>
      <button class="btn btn-ghost btn-full mt-12" id="resend-btn">Resend Verification Email</button>
    </div>

  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  // Apply theme
  const theme = localStorage.getItem('theme') || 'system';
  if (theme === 'dark') document.documentElement.dataset.theme = 'dark';
  else if (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';

  // Redirect if already logged in
  const redirect = new URLSearchParams(location.search).get('redirect') || 'index.html';
  auth.onAuthStateChanged(user => {
    if (user && user.emailVerified) window.location.href = redirect;
  });

  function switchTab(tab) {
    document.getElementById('login-form').style.display  = 'none';
    document.getElementById('signup-form').style.display = 'none';
    document.getElementById('forgot-form').style.display = 'none';
    document.getElementById('verify-notice').style.display = 'none';
    document.getElementById('tab-login').classList.toggle('active',  tab === 'login');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
    if (tab === 'login')  document.getElementById('login-form').style.display  = 'block';
    if (tab === 'signup') document.getElementById('signup-form').style.display = 'block';
    if (tab === 'forgot') {
      document.getElementById('forgot-form').style.display = 'block';
      document.getElementById('tab-login').classList.remove('active');
      document.getElementById('tab-signup').classList.remove('active');
    }
  }

  // ─── LOGIN ───────────────────────────────────────────────────
  document.getElementById('login-btn').addEventListener('click', async () => {
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const err      = document.getElementById('login-error');
    err.style.display = 'none';

    if (!email || !password) { showErr(err, 'Please fill in all fields.'); return; }

    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      if (!cred.user.emailVerified) {
        await auth.signOut();
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('verify-notice').style.display = 'block';
        return;
      }
      window.location.href = redirect;
    } catch (e) {
      const msg = e.code === 'auth/user-not-found' || e.code === 'auth/invalid-login-credentials'
        ? 'No account found with this email.'
        : e.code === 'auth/wrong-password'
          ? 'Incorrect password.'
          : e.message;
      showErr(err, msg);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
    }
  });

  // ─── SIGNUP ──────────────────────────────────────────────────
  document.getElementById('signup-btn').addEventListener('click', async () => {
    const name     = document.getElementById('signup-name').value.trim();
    const email    = document.getElementById('signup-email').value.trim();
    const phone    = document.getElementById('signup-phone').value.trim();
    const password = document.getElementById('signup-password').value;
    const confirm  = document.getElementById('signup-confirm').value;
    const err      = document.getElementById('signup-error');
    err.style.display = 'none';

    if (!name || !email || !password) { showErr(err, 'Please fill in all required fields.'); return; }
    if (password.length < 6)          { showErr(err, 'Password must be at least 6 characters.'); return; }
    if (password !== confirm)          { showErr(err, 'Passwords do not match.'); return; }

    const btn = document.getElementById('signup-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating account...';

    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      await cred.user.updateProfile({ displayName: name });
      await cred.user.sendEmailVerification();

      // Save user profile to Firestore
      await db.collection('users').doc(cred.user.uid).set({
        name,
        email,
        phone: phone || '',
        addresses: [],
        theme: 'system',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      await auth.signOut();
      document.getElementById('signup-form').style.display = 'none';
      document.getElementById('tab-login').classList.remove('active');
      document.getElementById('tab-signup').classList.remove('active');
      document.getElementById('verify-notice').style.display = 'block';
    } catch (e) {
      const msg = e.code === 'auth/email-already-in-use'
        ? 'An account with this email already exists.'
        : e.message;
      showErr(err, msg);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
    }
  });

  // ─── FORGOT PASSWORD ─────────────────────────────────────────
  document.getElementById('forgot-link').addEventListener('click', e => {
    e.preventDefault();
    switchTab('forgot');
  });

  document.getElementById('reset-btn').addEventListener('click', async () => {
    const email   = document.getElementById('reset-email').value.trim();
    const err     = document.getElementById('reset-error');
    const success = document.getElementById('reset-success');
    err.style.display = success.style.display = 'none';
    if (!email) { showErr(err, 'Enter your email address.'); return; }

    try {
      await auth.sendPasswordResetEmail(email);
      success.textContent = 'Reset link sent! Check your email.';
      success.style.display = 'block';
    } catch (e) {
      showErr(err, e.code === 'auth/user-not-found' ? 'No account with this email.' : e.message);
    }
  });

  // ─── RESEND VERIFICATION ─────────────────────────────────────
  document.getElementById('resend-btn').addEventListener('click', async () => {
    const email    = document.getElementById('login-email').value.trim() ||
                     document.getElementById('signup-email').value.trim();
    const password = document.getElementById('login-password').value ||
                     document.getElementById('signup-password').value;
    if (!email || !password) {
      alert('Please go back and sign in to resend the verification email.');
      return;
    }
    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      await cred.user.sendEmailVerification();
      await auth.signOut();
      alert('Verification email resent!');
    } catch (e) {
      alert('Could not resend: ' + e.message);
    }
  });

  function showErr(el, msg) {
    el.textContent = msg;
    el.style.display = 'block';
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const loginVisible  = document.getElementById('login-form').style.display  !== 'none';
      const signupVisible = document.getElementById('signup-form').style.display !== 'none';
      if (loginVisible)  document.getElementById('login-btn').click();
      if (signupVisible) document.getElementById('signup-btn').click();
    }
  });
</script>
<script>function toggleMenu(){document.getElementById("mobile-menu")?.classList.toggle("open");}</script>
<script>
  // Cart badge update
  (function updateBadges(){
    var cart = JSON.parse(localStorage.getItem('cart') || '{"items":[]}');
    var count = (cart.items||[]).reduce(function(s,i){return s+i.quantity;},0);
    var el  = document.getElementById('cart-count');
    var mel = document.getElementById('mobile-cart-count');
    if(el){ el.textContent=count; el.classList.toggle('show',count>0); }
    if(mel){ mel.textContent=count>0?count:''; mel.classList.toggle('show',count>0); }
  })();
  function toggleMenu(){ document.getElementById('mobile-menu')?.classList.toggle('open'); }
</script>
<script src="tb-cursor.js" defer></script>
</body>
</html>
